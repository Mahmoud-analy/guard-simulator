<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>محاكاة أنواع حواجز حماية المعدات</title>
<style>
:root{
  --navy:#1F3864;--gold:#B08D57;--bg:#F7F5F1;--card:#FFFFFF;--text:#1d2430;--muted:#6b7280;--border:#E3E0D8;
  --green:#2E7D32;--red:#C62828;--scene:#EEF1F6;--metal:#8a93a3;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#15181f;--card:#1d2129;--text:#eceef1;--muted:#9aa3af;--border:#333945;--scene:#252a35;--metal:#6c7585;}
}
:root[data-theme="dark"]{--bg:#15181f;--card:#1d2129;--text:#eceef1;--muted:#9aa3af;--border:#333945;--scene:#252a35;--metal:#6c7585;}
*{box-sizing:border-box;}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,Arial,sans-serif;}
.app{max-width:720px;margin:0 auto;padding:18px 16px 50px;}
header{text-align:center;margin-bottom:12px;}
header h1{color:var(--navy);font-size:1.3rem;margin:0 0 4px;}
header p{color:var(--gold);font-weight:600;margin:0;font-size:.88rem;}
.grp{font-size:.74rem;color:var(--muted);font-weight:700;margin:12px 0 6px;}
.chips{display:flex;flex-wrap:wrap;gap:7px;}
.chip{padding:7px 12px;border:1px solid var(--border);border-radius:18px;background:var(--card);font-size:.8rem;cursor:pointer;color:var(--text);}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy);}
.scene{position:relative;height:210px;background:var(--scene);border:1px solid var(--border);border-radius:14px;margin-top:14px;overflow:hidden;}
.scene div,.scene span{position:absolute;}
.floor{left:0;right:0;bottom:0;height:34px;background:var(--border);}
.table{left:62%;top:150px;width:34%;height:26px;background:var(--metal);border-radius:4px;transition:left .5s;}
.ram{left:70%;top:18px;width:18%;height:62px;background:var(--navy);border-radius:6px;transition:transform .7s ease-in-out,left .5s,background .3s;}
.ram.down{transform:translateY(62px);}
.ram.stop{background:#777;}
.zone{left:70%;top:90px;width:18%;height:58px;border:2px dashed var(--red);border-radius:6px;opacity:.5;transition:left .5s;}
.hand{left:3%;top:122px;font-size:30px;transition:left 1.2s ease-in-out;z-index:3;}
.hand2{left:3%;top:150px;font-size:26px;display:none;z-index:3;transition:opacity .3s;}
.barrier{left:57%;top:70px;width:10px;height:106px;background:var(--metal);border-radius:3px;display:none;transition:transform .6s;z-index:2;}
.barrier.up{transform:translateY(-70px);}
.panel{left:58%;top:70px;width:34%;height:12px;background:var(--metal);border-radius:3px;display:none;transition:top .6s,transform .5s;z-index:2;}
.beam{left:57%;top:70px;height:106px;border-left:3px dashed var(--green);display:none;transition:border-color .2s;z-index:2;}
.beam.hit{border-color:var(--red);}
.strap{left:0;top:140px;height:3px;background:var(--gold);display:none;transition:width 1.2s ease-in-out;z-index:1;}
.block{left:30%;top:140px;width:34px;height:34px;background:#C9A26B;border-radius:4px;display:none;transition:left 1.4s ease-in-out;z-index:2;}
.feeder{left:8%;top:134px;width:60px;height:46px;background:var(--gold);border-radius:6px;display:none;transition:left 1.4s ease-in-out;}
.btnA,.btnB{top:176px;width:34px;height:20px;border-radius:5px;background:var(--red);display:none;transition:background .3s;}
.btnA{left:6%;}.btnB{left:22%;}
.btnA.ok,.btnB.ok{background:var(--green);}
.reach{left:40%;top:112px;height:64px;border-left:2px dotted var(--red);display:none;}
.reachL{left:30%;top:94px;font-size:.66rem;color:var(--red);display:none;}
.status{margin-top:10px;min-height:44px;padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--border);font-size:.86rem;font-weight:600;color:var(--navy);}
.run{display:block;width:100%;margin-top:10px;padding:11px;border:none;border-radius:10px;background:var(--gold);color:#fff;font-size:.95rem;font-weight:700;cursor:pointer;}
.info{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-top:12px;}
.info h2{margin:0;color:var(--navy);font-size:1.05rem;}
.info .en{color:var(--gold);font-weight:700;font-size:.8rem;margin-bottom:8px;}
.info p{margin:6px 0;font-size:.86rem;line-height:1.8;}
.info b{color:var(--navy);}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🛡️ محاكاة أنواع حواجز وأجهزة حماية المعدات</h1>
    <p>Machine Safeguarding Simulator — كتالوج تفاعلي متحرك</p>
  </header>

  <div id="groups"></div>

  <div class="scene" id="scene">
    <div class="floor"></div>
    <div class="table" id="table"></div>
    <div class="zone" id="zone"></div>
    <div class="ram" id="ram"></div>
    <div class="barrier" id="barrier"></div>
    <div class="panel" id="panel"></div>
    <div class="beam" id="beam"></div>
    <div class="strap" id="strap"></div>
    <div class="reach" id="reach"></div><span class="reachL" id="reachL">حد الوصول</span>
    <div class="block" id="block"></div>
    <div class="feeder" id="feeder"></div>
    <div class="btnA" id="btnA"></div><div class="btnB" id="btnB"></div>
    <span class="hand" id="hand">✋</span><span class="hand2" id="hand2">✋</span>
  </div>
  <div class="status" id="status">اختر نوع الحاجز ثم اضغط "تشغيل المحاكاة".</div>
  <button class="run" onclick="runSim()">▶ تشغيل المحاكاة</button>

  <div class="info" id="info"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const types = [
 {g:"الحواجز (Guards)", k:"fixed", ar:"حاجز ثابت", en:"Fixed Guard",
  what:"حاجز دائم جزء من هيكل الماكينة، يمنع الوصول لمنطقة الخطر تمامًا.",
  when:"عندما لا يحتاج العامل الوصول لمنطقة الخطر أثناء التشغيل.",
  ex:"أغطية التروس والسيور والبكرات."},
 {g:"الحواجز (Guards)", k:"inter", ar:"حاجز بمفتاح فصل", en:"Interlocked Guard",
  what:"عند فتحه أو إزالته تتوقف الماكينة تلقائيًا ولا تعمل إلا بعد إعادته.",
  when:"عند الحاجة لفتح الحاجز بشكل متكرر للصيانة أو التنظيف.",
  ex:"أبواب ماكينات التعبئة والتغليف والمفرمات."},
 {g:"الحواجز (Guards)", k:"adj", ar:"حاجز قابل للتعديل", en:"Adjustable Guard",
  what:"يضبطه العامل يدويًا ليناسب حجم المادة المشغَّلة.",
  when:"عندما يتغير حجم أو سمك المادة من مهمة لأخرى.",
  ex:"المنشار الشريطي، وحاجز لقمة المثقاب."},
 {g:"الحواجز (Guards)", k:"self", ar:"حاجز ذاتي التعديل", en:"Self-Adjusting Guard",
  what:"يتحرك تلقائيًا بدفع المادة نفسها، ثم يعود لوضعه فيغطي منطقة الخطر.",
  when:"عندما يتنوع حجم المادة ونريد الاستغناء عن ضبط العامل.",
  ex:"الحاجز السفلي المتحرك للمنشار الدائري."},
 {g:"أجهزة الحماية (Devices)", k:"photo", ar:"خلية كهروضوئية", en:"Photoelectric Device",
  what:"ستارة ضوئية؛ عند قطعها باليد تتوقف الماكينة فورًا.",
  when:"المكابس والمقصات التي تتطلب إدخال اليد بين الدورات.",
  ex:"مكابس الصاج والمقصات الصناعية."},
 {g:"أجهزة الحماية (Devices)", k:"pull", ar:"نظام السحب للخلف", en:"Pullback Device",
  what:"أربطة مثبتة باليدين تسحبهما بعيدًا تلقائيًا مع نزول المكبس.",
  when:"المكابس ذات الدورة الكاملة حيث تدخل اليد منطقة الخطر.",
  ex:"مكابس التثقيب والتشكيل."},
 {g:"أجهزة الحماية (Devices)", k:"rest", ar:"نظام الإيقاف المحدد", en:"Restraint Device",
  what:"حبل بطول ثابت يربط اليد، فلا تصل اليد لمنطقة الخطر مهما حاول العامل.",
  when:"عندما يمكن ضبط طول الحبل بحيث لا يتجاوز حد الأمان.",
  ex:"المكابس الميكانيكية قليلة التغذية اليدوية."},
 {g:"أجهزة الحماية (Devices)", k:"two", ar:"التحكم باليدين الاثنين", en:"Two-Hand Control",
  what:"لا تعمل الماكينة إلا بضغط زرين معًا، فتبقى اليدان بعيدتين عن منطقة الخطر.",
  when:"المكابس الهيدروليكية ذات الدورة المحددة.",
  ex:"المكابس الهيدروليكية ومقصات المعادن."},
 {g:"طرق أخرى", k:"loc", ar:"الحماية بالموقع والمسافة", en:"Safeguarding by Location",
  what:"وضع منطقة الخطر بعيدًا عن متناول العامل بالمسافة أو الارتفاع.",
  when:"عندما يمكن تصميم مكان التشغيل بحيث لا يصل العامل لنقطة الخطر.",
  ex:"تركيب الماكينة خلف حاجز مسافة أمان، أو على ارتفاع."},
 {g:"طرق أخرى", k:"feed", ar:"التغذية الآلية", en:"Automatic Feeding",
  what:"مغذٍّ آلي يدخل المادة للماكينة، فلا يدخل العامل يده منطقة الخطر.",
  when:"الإنتاج المتكرر بنفس الشكل من المادة.",
  ex:"خطوط التغذية الآلية للمكابس وخطوط التعبئة."}
];

let cur = types[0], busy = false, timer = null;
const groups = [...new Set(types.map(t=>t.g))];
$('groups').innerHTML = groups.map(g=>`<div class="grp">${g}</div><div class="chips">${
  types.filter(t=>t.g===g).map(t=>`<button class="chip" id="c_${t.k}" onclick="pick('${t.k}')">${t.ar}</button>`).join('')}</div>`).join('');

function pick(k){
  if(busy) return;
  cur = types.find(t=>t.k===k);
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
  $('c_'+k).classList.add('on');
  $('info').innerHTML = `<h2>${cur.ar}</h2><div class="en">${cur.en}</div>
    <p><b>ما هو؟</b> ${cur.what}</p><p><b>متى يُستخدم؟</b> ${cur.when}</p><p><b>أمثلة صناعية:</b> ${cur.ex}</p>`;
  reset();
  setup(k);
  $('status').textContent = 'اضغط "تشغيل المحاكاة" لمشاهدة آلية عمل: ' + cur.ar;
}
function show(ids){ ids.forEach(i=>$(i).style.display='block'); }
function reset(){
  clearInterval(timer);
  ['barrier','panel','beam','strap','block','feeder','btnA','btnB','reach','reachL'].forEach(i=>{ $(i).style.display='none'; $(i).className=$(i).className.replace(/\b(up|hit|ok)\b/g,'').trim(); });
  $('hand2').style.display='none';
  $('ram').className='ram'; $('table').style.left='62%'; $('zone').style.left='70%'; $('ram').style.left='70%';
  $('hand').style.transition='none'; $('hand').style.left='3%'; $('hand').style.top='122px'; $('hand').offsetHeight; $('hand').style.transition='';
  $('barrier').style.transform=''; $('panel').style.top='70px'; $('panel').style.transform='';
  $('strap').style.width='0'; $('block').style.left='30%'; $('feeder').style.left='8%';
}
function setup(k){
  if(k==='fixed'||k==='inter') show(['barrier']);
  if(k==='adj'||k==='self') show(['panel']);
  if(k==='photo') show(['beam']);
  if(k==='pull'||k==='rest') show(['strap']);
  if(k==='two') { show(['btnA','btnB']); $('hand').style.left='5%'; $('hand').style.top='146px'; $('hand2').style.display='block'; $('hand2').style.left='21%'; }
  if(k==='loc') { show(['reach','reachL']); $('table').style.left='80%'; $('ram').style.left='85%'; $('zone').style.left='85%'; }
  if(k==='feed') { show(['feeder','block']); }
}
function cycle(on){
  clearInterval(timer);
  if(!on){ $('ram').classList.remove('down'); return; }
  timer = setInterval(()=>$('ram').classList.toggle('down'), 800);
}
function say(t){ $('status').textContent = t; }

async function runSim(){
  if(busy) return; busy = true;
  const k = cur.k; pick_reset_keep();
  try{
  if(k==='fixed'){
    cycle(true); say('الماكينة تعمل... العامل يحاول الوصول لمنطقة الخطر.');
    $('hand').style.left='50%'; await sleep(1500);
    say('✅ الحاجز الثابت منع وصول اليد تمامًا؛ لا يعتمد على أي تصرف من العامل.');
  }
  if(k==='inter'){
    cycle(true); say('الماكينة تعمل... العامل يفتح الحاجز للصيانة.');
    $('hand').style.left='50%'; await sleep(1500);
    $('barrier').classList.add('up'); cycle(false); $('ram').classList.add('stop');
    say('✅ بمجرد فتح الحاجز توقفت الماكينة تلقائيًا، وتدخل اليد بعد التوقف الكامل فقط.');
    await sleep(900); $('hand').style.left='66%'; await sleep(1200);
  }
  if(k==='adj'){
    $('block').style.display='block'; $('block').style.left='60%'; $('block').style.width='34px'; $('block').style.top='140px';
    say('مادة صغيرة: العامل يضبط الحاجز على فتحة صغيرة...');
    $('panel').style.top='118px'; cycle(true); await sleep(1800);
    say('مادة كبيرة: العامل يرفع الحاجز يدويًا قبل بدء العمل...');
    $('block').style.width='34px'; $('block').style.top='110px'; $('block').style.height='64px'; $('panel').style.top='96px'; await sleep(1800);
    say('✅ الحاجز القابل للتعديل يناسب حجم المادة، لكنه يحتاج ضبطًا صحيحًا من العامل قبل كل مهمة.');
    $('block').style.height='34px';
  }
  if(k==='self'){
    $('block').style.display='block'; $('block').style.left='25%'; cycle(true);
    say('العامل يدفع القطعة باتجاه الماكينة...');
    $('block').style.left='56%'; await sleep(1500);
    $('panel').style.transform='translateY(-34px)'; say('القطعة نفسها دفعت الحاجز للأعلى تلقائيًا...'); await sleep(1500);
    $('block').style.left='62%'; await sleep(1200);
    $('panel').style.transform=''; say('✅ عاد الحاجز لمكانه تلقائيًا؛ منطقة الخطر مغطاة دون تدخل العامل.');
  }
  if(k==='photo'){
    cycle(true); say('الستارة الضوئية تعمل... اليد تقترب من منطقة الخطر.');
    $('hand').style.left='52%'; await sleep(1500);
    $('beam').classList.add('hit'); cycle(false); $('ram').classList.add('stop');
    say('✅ اليد قطعت الشعاع الضوئي فتوقفت الماكينة فورًا قبل الوصول للخطر.');
  }
  if(k==='pull'){
    $('strap').style.width='8%'; await sleep(60);
    cycle(false); say('العامل يضع المادة وتتحرك يده نحو منطقة التشغيل...');
    $('strap').style.width='52%'; $('hand').style.left='50%'; await sleep(1500);
    say('المكبس يبدأ النزول... الأربطة تسحب اليد للخلف تلقائيًا.');
    $('ram').classList.add('down'); $('strap').style.width='8%'; $('hand').style.left='5%'; await sleep(1500);
    say('✅ اليد سُحبت بعيدًا قبل وصول المكبس لمنطقة الخطر.');
  }
  if(k==='rest'){
    $('strap').style.width='42%'; cycle(true); say('العامل يحاول مد يده نحو منطقة الخطر...');
    $('hand').style.left='38%'; await sleep(1500);
    say('✅ الحبل ثابت الطول فلا تصل اليد لمنطقة الخطر مهما حاول العامل.');
  }
  if(k==='two'){
    say('العامل يضغط الزرين معًا بيديه...');
    $('btnA').classList.add('ok'); await sleep(500); $('btnB').classList.add('ok'); cycle(true);
    await sleep(2200);
    say('العامل يرفع يدًا واحدة...'); $('btnB').classList.remove('ok'); $('hand2').style.opacity='.3'; cycle(false); $('ram').classList.add('stop');
    await sleep(1000);
    say('✅ لا تعمل الماكينة إلا بوجود اليدين على الزرين، فتبقى اليدان بعيدتين عن الخطر.');
  }
  if(k==='loc'){
    cycle(true); say('منطقة الخطر موضوعة بعيدًا عن متناول العامل...');
    $('hand').style.left='38%'; await sleep(1500);
    say('✅ المسافة تتجاوز مدى وصول اليد؛ نقطة التشغيل خارج المتناول.');
  }
  if(k==='feed'){
    cycle(true); say('المغذّي الآلي يدفع المادة للماكينة...');
    $('feeder').style.left='42%'; $('block').style.left='60%'; await sleep(1700);
    say('✅ المادة دخلت آليًا، ويد العامل بقيت بعيدة تمامًا عن منطقة الخطر.');
  }
  } finally { busy=false; }
}
function pick_reset_keep(){ reset(); setup(cur.k); }
pick('fixed');
</script>
</body>
</html>
